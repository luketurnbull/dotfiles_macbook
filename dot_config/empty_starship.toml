# ── Format ─────────────────────────────────────────────
format = """
$username$hostname $directory$git_branch$git_status
$character"""

# ── Username ───────────────────────────────────────────
[username]
show_always = true
style_user = "fg:#7aa2f7 bold"
style_root = "fg:#f7768e bold"
format = "[$user]($style)"

# ── Hostname ───────────────────────────────────────────
[hostname]
ssh_only = false
style = "fg:#565f89"
format = "[@$hostname]($style) "

# ── Directory ──────────────────────────────────────────
[directory]
style = "fg:#7dcfff bold"
truncation_length = 3
truncate_to_repo = true

# ── Git ────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "fg:#9ece6a"
format = "[$symbol$branch]($style)"

[git_status]
style = "fg:#e0af68"
format = '([ $all_status$ahead_behind]($style))'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"

# ── Prompt character ───────────────────────────────────
[character]
success_symbol = "[❯](fg:#9ece6a)"
error_symbol = "[❯](fg:#f7768e)"
