# ── Format ─────────────────────────────────────────────
format = """
$username$hostname $directory$git_branch$git_status
$character"""

# ── Username ───────────────────────────────────────────
[username]
show_always = true
style_user = "fg:#7fb2e8 bold"
style_root = "fg:#ff4d42 bold"
format = "[$user]($style)"

# ── Hostname ───────────────────────────────────────────
[hostname]
ssh_only = false
style = "fg:#7d7d7d"
format = "[@$hostname]($style) "

# ── Directory ──────────────────────────────────────────
[directory]
style = "fg:#74cfd1 bold"
truncation_length = 3
truncate_to_repo = true

# ── Git ────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "fg:#9fd08a"
format = "[$symbol$branch]($style)"

[git_status]
style = "fg:#e6c15c"
format = '([ $all_status$ahead_behind]($style))'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"

# ── Prompt character ───────────────────────────────────
[character]
success_symbol = "[❯](fg:#9fd08a)"
error_symbol = "[❯](fg:#ff4d42)"
