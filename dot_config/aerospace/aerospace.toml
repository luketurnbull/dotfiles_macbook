start-at-login = true

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
]

[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 5
outer.right = 5
outer.bottom = 5
outer.top = 5

[mode.main.binding]
alt-t = 'exec-and-forget open -na Ghostty'
alt-b = 'exec-and-forget open -na Helium --args --new-window'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = [
  'move-node-to-workspace 1',
  'workspace 1',
  'exec-and-forget sketchybar --trigger aerospace_windows_change',
]
alt-shift-2 = [
  'move-node-to-workspace 2',
  'workspace 2',
  'exec-and-forget sketchybar --trigger aerospace_windows_change',
]
alt-shift-3 = [
  'move-node-to-workspace 3',
  'workspace 3',
  'exec-and-forget sketchybar --trigger aerospace_windows_change',
]
alt-shift-4 = [
  'move-node-to-workspace 4',
  'workspace 4',
  'exec-and-forget sketchybar --trigger aerospace_windows_change',
]
alt-shift-5 = [
  'move-node-to-workspace 5',
  'workspace 5',
  'exec-and-forget sketchybar --trigger aerospace_windows_change',
]
alt-shift-6 = [
  'move-node-to-workspace 6',
  'workspace 6',
  'exec-and-forget sketchybar --trigger aerospace_windows_change',
]
alt-shift-7 = [
  'move-node-to-workspace 7',
  'workspace 7',
  'exec-and-forget sketchybar --trigger aerospace_windows_change',
]
alt-shift-8 = [
  'move-node-to-workspace 8',
  'workspace 8',
  'exec-and-forget sketchybar --trigger aerospace_windows_change',
]
alt-shift-9 = [
  'move-node-to-workspace 9',
  'workspace 9',
  'exec-and-forget sketchybar --trigger aerospace_windows_change',
]

alt-tab = 'workspace-back-and-forth'
